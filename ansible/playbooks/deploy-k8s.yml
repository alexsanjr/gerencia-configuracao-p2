---
- name: Publicar backend no AKS
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Aplicar recursos base do namespace
      ansible.builtin.command:
        cmd: kubectl apply -f {{ item }}
      loop:
        - kubernetes/namespace.yaml
        - kubernetes/resource-quota.yaml
        - kubernetes/limit-range.yaml
        - kubernetes/backend/deployment.yaml
        - kubernetes/backend/service.yaml
        - kubernetes/backend/hpa.yaml
        - kubernetes/gateway/ingress.yaml
        - kubernetes/gateway/frontend-service.yaml
        - kubernetes/gateway/frontend-ingress.yaml
      changed_when: true

    - name: Aguardar backend ficar pronto
      ansible.builtin.command:
        cmd: >-
          kubectl -n voce-aluga rollout status
          deployment/voce-aluga-backend --timeout=180s
      changed_when: false
