apiVersion: apps/v1
kind: Deployment
metadata:
  name: voce-aluga-backend
  namespace: voce-aluga
  labels:
    app.kubernetes.io/name: voce-aluga-backend
    app.kubernetes.io/part-of: voce-aluga
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: voce-aluga-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voce-aluga-backend
        app.kubernetes.io/part-of: voce-aluga
    spec:
      containers:
        - name: backend
          image: alexsanjr/voce-aluga-backend:54b75ad
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
