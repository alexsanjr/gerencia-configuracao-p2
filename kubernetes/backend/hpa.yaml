apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voce-aluga-backend
  namespace: voce-aluga
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voce-aluga-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
